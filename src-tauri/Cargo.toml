[package]
name = "luckyray-mobile"
version = "0.1.0"
description = "LuckyRay Mobile - official Android app"
authors = ["LuckyRay M1 Lab"]
edition = "2021"

[lib]
name = "luckyray_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-barcode-scanner = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots", "stream", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
sha2 = "0.10"
getrandom = "0.2"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
x509-parser = "0.16"
base64 = "0.22"

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", default-features = false }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"


[dev-dependencies]
rcgen = "0.13"
tokio-rustls = "0.26"
