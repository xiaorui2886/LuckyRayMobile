      - name: Real CodeMirror attachment and viewport DOM regressions
        run: |
          npm install --prefix "$RUNNER_TEMP/lr-dom" --no-package-lock --ignore-scripts jsdom@30.1.3
          LR_JSDOM_MODULE="$RUNNER_TEMP/lr-dom/node_modules/jsdom" node scripts/qa/mobileR6Editor.dom.cjs
          LR_DOM_TEST_TOOLS="$RUNNER_TEMP/lr-dom/node_modules" node --test tests/scopedBackgroundViews.dom.test.mjs tests/desktopLibraryPicker.dom.test.mjs tests/mobileR8LibraryAgent.dom.test.mjs tests/mobileModeTransition.dom.test.mjs tests/mobileLivePreview.dom.test.mjs tests/mobileLivePreviewEditor.dom.test.mjs tests/mobileSideNavigation.dom.test.mjs tests/noteViewportStability.dom.test.mjs tests/nativeTextareaCaret.dom.test.mjs tests/noteChrome.dom.test.mjs tests/mobileTableMenuPolish.dom.test.mjs tests/noteSidebarLayout.dom.test.mjs tests/notePaperRail.dom.test.mjs tests/notePaperCmIntegration.dom.test.mjs tests/notePaperLifecycle.dom.test.mjs tests/desktopDocumentFallback.dom.test.mjs tests/lshAgentRetention.dom.test.mjs tests/mobileTableHistoryIdentity.dom.test.mjs tests/mobileTableHistoryMode.dom.test.mjs tests/mobileTableHistoryReview.dom.test.mjs tests/mobileTableParity.dom.test.mjs tests/noteTailClearance.dom.test.mjs tests/noteTailCmIntegration.dom.test.mjs tests/noteEditChrome.dom.test.mjs tests/librarySurfacesDom.test.mjs tests/mobileSettingsPolish.dom.test.mjs tests/systemBarSeam.dom.test.mjs
      - name: Saved-library schema 14 preservation and parked-operation SQL
        run: python3 scripts/test-saved-library-migration.py
      - name: Build production web assets
        run: pnpm build
      - name: Verify production Markdown worker without DOM
        run: node scripts/check-markdown-worker.mjs
      - name: Verify dependency lockfiles unchanged
        run: git diff --exit-code -- pnpm-lock.yaml src-tauri/Cargo.lock

  pinning-tests:
    name: Rust TLS pinning and SQLite migration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Select Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Test actual pinning module with locked dependencies
        run: python3 scripts/check-pinning-public.py
      - name: Test actual SQLite module and local folder migration
        run: python3 scripts/check-database-public.py
      - name: Verify application lockfile unchanged
        run: git diff --exit-code -- src-tauri/Cargo.lock

  android-release:
    name: Android ARM64 optimized release APK (unsigned)
    needs: [frontend-contract, pinning-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.ci-android-target
      CARGO_TERM_COLOR: always
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android SDK components
        run: |
          # Use the runner's existing SDK and accepted licenses. Never auto-accept new terms.
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" < /dev/null
          test -d "$ANDROID_HOME/platforms/android-36"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -d "$ANDROID_HOME/ndk/27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Select Rust stable and Android ARM64 target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android
          rustc --version
          cargo --version
      - name: Install locked JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Build optimized release APK from tracked sources
        run: bash scripts/build-android-public.sh --release
      - name: Verify dependency lockfiles unchanged
        run: git diff --exit-code -- pnpm-lock.yaml src-tauri/Cargo.lock
      - name: Verify APK and prepare artifact
        run: |
          mkdir -p public-apk
          mapfile -d '' apks < <(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*release-unsigned.apk' -print0)
          test "${#apks[@]}" -eq 1
          for apk in "${apks[@]}"; do
            "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" > "$RUNNER_TEMP/apk-badging.txt"
            grep -q "package: name='com.luckyray.mobile'" "$RUNNER_TEMP/apk-badging.txt"
            grep -q "native-code:.*'arm64-v8a'" "$RUNNER_TEMP/apk-badging.txt"
            if grep -q 'application-debuggable' "$RUNNER_TEMP/apk-badging.txt"; then
              echo 'Release APK must not be debuggable' >&2; exit 1
            fi
            "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 "$apk"
            python scripts/check-apk-bridges.py "$apk"
            cp "$apk" public-apk/
          done
          (cd public-apk && sha256sum ./*.apk > SHA256SUMS)
          cp BUILDING.md public-apk/
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          files = ['pnpm-lock.yaml', 'src-tauri/Cargo.lock']
          identity = {'sourceCommit': os.environ['GITHUB_SHA'], 'profile': 'release',
                      'target': 'aarch64-linux-android', 'signing': 'unsigned; local signing required',
                      'runUrl': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
                      'lockfiles': {p: hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in files}}
          pathlib.Path('public-apk/BUILD-IDENTITY.json').write_text(json.dumps(identity, indent=2) + '\n')
          PY
      - name: Upload unsigned release candidate (7 days)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LuckyRayMobile-android-arm64-release-unsigned-${{ github.sha }}
          path: public-apk/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
