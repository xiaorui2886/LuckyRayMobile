name: Public build and tests

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "public/**"
  workflow_dispatch:

# This workflow needs only source checkout. It never receives signing keys,
# production credentials, an Android emulator, or a connected device.
permissions:
  contents: read

concurrency:
  group: public-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-contract:
    name: Frontend, sync, and Protocol V1 conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript typecheck
        run: node node_modules/typescript/bin/tsc --noEmit
      # Keep this offline-safe list explicit. Live companion integration tests
      # are intentionally outside the public CI contract.
      - name: Navigation, sync, local protocol, autosave, filter, library, invalidation, provenance, and IME-authority tests
        run: >-
          node --experimental-strip-types --test
          tests/managedWikiProof.test.ts
          tests/managedBoundWiki.test.ts
          tests/managedImportIntents.test.ts
          tests/managedNoteResources.test.ts
          tests/managedSyncSchedule.test.ts
          tests/managedVaultMutations.test.ts
          tests/managedWikiIdentity.test.ts
          tests/scopedKnowledgeSnapshots.test.ts
          tests/scopedServiceLifecycle.test.ts
          tests/desktopPageScopedSnapshots.test.ts
          tests/desktopLibrarySelection.test.ts
          tests/materialApiScope.test.ts
          tests/knowledgeSelectedVault.test.ts
          tests/knowledgeSelectedFailure.test.ts
          tests/knowledgeDiagnostics.test.ts
          tests/directoryMetadataPolicy.test.ts
          tests/localBacklinks.test.ts
          tests/mobileAssetViewerOvernight.test.ts
          tests/mobileTableStyles.contract.test.mjs
          tests/tableMarkdownModel.test.ts
          tests/mobileLivePreviewModel.test.ts
          tests/localNoteUploadFailure.test.ts
          tests/noteTypography.contract.test.mjs
          tests/highlightSyntax.test.ts
          tests/mobileMarkdownCommands.test.ts
          tests/sharedNoteMarkdown.test.ts
          tests/wikiChoiceRows.test.ts
          tests/cmMobileMarkdownInsertion.test.ts
          tests/localWikiHistoryPaths.test.ts
          tests/mobileMarkdownInsertions.test.ts
          tests/noteHeadingNavigation.test.ts
          tests/noteHeadings.test.ts
