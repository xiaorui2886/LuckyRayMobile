name: Read-only canvas focused native QA
on:
  push:
    branches: [qa/canvas-readonly-20261104]
    paths: ['.github/workflows/ci-lite.yml']
permissions:
  contents: read
concurrency:
  group: canvas-readonly-${{ github.ref }}
  cancel-in-progress: false
jobs:
  focused-native:
    if: >-
      github.event_name == 'push' && github.event.before == 'fd21f120369e64779ed52666d3dd29e3f2e7f9c8' && github.event.head_commit.message == 'test: run reviewed readonly canvas native QA after workflow validation fix (20261104)'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: aba6cd856fa6d0f6da796b76f39d99dcbeb7ba12
      - name: Verify exact reviewed source commit
        run: |
          test "$(git rev-parse HEAD)" = "aba6cd856fa6d0f6da796b76f39d99dcbeb7ba12"
          git rev-parse HEAD
      - name: Verify reviewed source bytes
        run: sha256sum --check tests/canvas-qa-sources.sha256
      - name: Select pinned official Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal --no-self-update
          rustup override set 1.95.0
      - name: Isolate Cargo cache and target directories
        run: |
          printf 'CARGO_HOME=%s/canvas-cargo-home\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'CARGO_TARGET_DIR=%s/canvas-target\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Prepare exact application-locked test dependencies
        run: python3 tests/prepare_canvas_dependency_cache.py
      - name: Actual upstream with synthetic loopback HTTP and fail-closed TLS adapter
        run: python3 tests/check_canvas_transport.py
      - name: Actual local carrier with synthetic connection fixtures
        run: python3 tests/check_canvas_carrier.py
      - name: Verify dependency lock and reviewed inputs unchanged
        run: |
          sha256sum --check tests/canvas-qa-sources.sha256
          git diff --exit-code -- src-tauri/Cargo.lock
