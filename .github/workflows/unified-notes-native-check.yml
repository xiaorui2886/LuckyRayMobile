name: Unified notes source and native checks
on:
  push:
    branches: [ray/unified-notes-check-20261025]
permissions:
  contents: read
concurrency:
  group: unified-notes-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.3.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Complete explicit unit and contract checks
        run: node scripts/run-ci-lite-local.mjs
      - name: Existing pinned local DOM test tools
        run: npm install --prefix "$RUNNER_TEMP/lr-dom" --ignore-scripts --no-audit --no-fund jsdom@26.1.0
      - name: Actual managed-note React components with synthetic native seams
        run: LR_DOM_TEST_TOOLS="$RUNNER_TEMP/lr-dom/node_modules" node scripts/check-managed-dom.mjs
      - name: TypeScript and frontend build
        run: pnpm build
  windows-native:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.3.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - name: Official pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --no-self-update
      - name: Record exact source and tools
        run: |
          git rev-parse HEAD
          node --version
          pnpm --version
          rustc +1.95.0 --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Full host-native Tauri application and test-target typecheck (not Android runtime acceptance)
        run: cargo +1.95.0 check --locked --manifest-path src-tauri/Cargo.toml --all-targets
